<!DOCTYPE html>

<header>

  <nav>

</header>mapa
<main>

<section>
  <h2>Fale Conosco</h2>

  <form>

    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" required>

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <br><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone">

    <br><br>

    <label for="assunto">Assunto:</label>
    <select id="assunto" name="assunto">
      <option>Dúvida</option>
      <option>Matrícula</option>
      <option>Financeiro</option>
    </select>

    <br><br>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" minlength="20" required></textarea>

    <br><br>

    <input type="checkbox" id="politica" required>
    <label for="politica">Aceito a política de privacidade</label>

    <br><br>

    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>

  </form>

</section>

<section>
  <h2>Localização</h2>

  <address>
    Rua Rui Barbosa, 710 - Cruz das Almas - BA
  </address>

  <figure>
    <img src="images/mapa.png" alt="Mapa de localização da universidade">
    <figcaption>Localização da UFRB</figcaption>
  </figure>

</section>

</main>

<footer>

</footer>
